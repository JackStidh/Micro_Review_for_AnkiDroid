name: Design preview

# Builds the "redesign" branch, runs its unit tests and lint, and takes screenshots of every screen in every theme
# on an emulator (DesignPreviewTest), pushed to the "design-shots" branch to look at.
on:
  push:
    branches: [ "redesign" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: 'gradle'
    - run: chmod +x gradlew
    - name: Unit tests, build and lint
      run: ./gradlew testDebugUnitTest assembleDebug lintDebug

  screenshots:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: 'gradle'
    - run: chmod +x gradlew
    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    - name: Screenshots on an emulator
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 34
        arch: x86_64
        target: google_apis
        disable-animations: false
        script: |
          ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.orlikalabs.microreview.DesignPreviewTest || echo "TESTS FAILED"
          adb pull /data/local/tmp/design shots || true
          adb logcat -d -t 400 > shots-logcat.txt || true
    - name: Push the screenshots to the design-shots branch
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        mkdir -p /tmp/pub
        cp shots/*.png /tmp/pub/ 2>/dev/null || true
        cp shots-logcat.txt /tmp/pub/ 2>/dev/null || true
        find app/build -path '*androidTest-results*' -name '*.xml' -exec cp {} /tmp/pub/ \; 2>/dev/null || true
        cd /tmp/pub
        git init -q
        git checkout -q -b design-shots
        git add .
        git -c user.name="design-preview" -c user.email="design-preview@users.noreply.github.com" commit -qm "Design preview of ${{ github.sha }}"
        git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" design-shots
