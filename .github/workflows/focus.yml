name: Focus build

# Builds the "focus" branch and publishes the debug APK and the desktop Anki add-on (.ankiaddon) as the
# "focus-latest" pre-release, so they can be downloaded and installed (Releases page of the repository).
on:
  push:
    branches: [ "focus" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set Up JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: 'gradle'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Unit tests
      run: ./gradlew testDebugUnitTest

    - name: Build the debug APK
      run: ./gradlew assembleDebug

    - name: Desktop add-on tests
      run: |
        python3 -m pip install --quiet pytest
        python3 -m pytest -q desktop/tests

    - name: Build the desktop add-on
      run: |
        cd desktop/micro_review_desktop
        zip -r -q ../../micro-review-desktop.ankiaddon . -x "__pycache__/*" "*/__pycache__/*" "user_files/*"

    - name: Upload the APK
      uses: actions/upload-artifact@v4
      with:
        name: micro-review-focus-debug
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Publish the "focus-latest" pre-release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        cp app/build/outputs/apk/debug/app-debug.apk micro-review-focus.apk
        gh release delete focus-latest --cleanup-tag --yes || true
        gh release create focus-latest micro-review-focus.apk micro-review-desktop.ankiaddon \
          --prerelease \
          --target "${{ github.sha }}" \
          --title "Micro Review Focus (latest build)" \
          --notes "Build of the focus branch at ${{ github.sha }}. Phone: install the APK over the previous one (AnkiDroid must be installed with its API enabled). PC: double-click the .ankiaddon with Anki installed, or Anki › Tools › Add-ons › Install from file."

  # Lint apart, so that a lint finding doesn't hold the APK back.
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set Up JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: 'gradle'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Lint
      run: ./gradlew lintDebug

    # The log only names the first finding: list every error, to fix them without the HTML report.
    - name: Lint errors
      if: always()
      run: |
        grep -h -A3 ": Error:" app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt || true

    - name: Upload the lint report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: lint-report
        path: app/build/reports/lint-results-debug.html
