name: Classpath dump (temporary)
on:
  push:
    branches: [ "cp-dump" ]
permissions:
  contents: write
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: 'gradle'
    - run: chmod +x gradlew
    - name: Dump the debug compile classpath
      run: |
        cat > /tmp/cp.gradle <<'G'
        allprojects {
          afterEvaluate { p ->
            if (p.path == ':app') {
              p.tasks.register('dumpCp') {
                doLast {
                  def view = p.configurations.getByName('debugCompileClasspath').incoming.artifactView {
                    attributes { attribute(Attribute.of('artifactType', String), 'android-classes-jar') }
                  }
                  p.file('build').mkdirs()
                  p.file('build/cp.txt').text = view.files.collect { it.absolutePath }.join('\n')
                }
              }
            }
          }
        }
        G
        ./gradlew --no-configuration-cache -I /tmp/cp.gradle :app:dumpCp
        mkdir -p /tmp/cp
        i=0
        while read -r f; do
          i=$((i+1))
          base=$(echo "$f" | sed -E 's#.*/(transformed|files-2.1)/##; s#/#__#g')
          cp "$f" "/tmp/cp/$(printf %03d $i)_$base"
        done < app/build/cp.txt
        cp app/build/cp.txt /tmp/cp/cp.txt
        tar czf cp.tgz -C /tmp cp
        ls -la cp.tgz
    - name: Publish
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release delete cp-dump --cleanup-tag --yes || true
        gh release create cp-dump cp.tgz --prerelease --target "${{ github.sha }}" --title "temporary" --notes "temporary"
